spring:
  application:
    name: transcourse
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      # 레코드마다 원본 전체를 내려받아 처리하므로 한 건씩 가져온다
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        "[group.protocol]": classic
        "[partition.assignment.strategy]": ${KAFKA_ASSIGNMENT_STRATEGY:org.apache.kafka.clients.consumer.RangeAssignor}
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

server:
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  ffmpeg:
    ffprobe-path: ffprobe
    ffmpeg-path: ffmpeg
  kafka:
    jobs-topic: video.jobs
    jobs-partitions: 6
    transcoding-threads: 6
  recovery:
    poll-interval: 60s
    # 토픽에서 대기하는 시간은 정상이므로, 발행 유실로 볼 만큼 충분히 길어야 한다
    pending-stale-after: 10m
    running-timeout: 300s
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    presign-endpoint: ${APP_STORAGE_PRESIGN_ENDPOINT:}
    # 플레이리스트 발급 시점에 모든 세그먼트 URL이 고정되므로, VOD 최대 재생 시간보다 길어야 한다
    presign-ttl: 4h
    bucket: transcourse
    access-key: ${APP_STORAGE_ACCESS_KEY:minio}
    secret-key: ${APP_STORAGE_SECRET_KEY:localminio}